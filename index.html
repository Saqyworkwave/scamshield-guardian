<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#003087">
<title>ScamShield Guardian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- Atkinson Hyperlegible: a typeface designed for maximum legibility. Falls back to system fonts. -->

<style>
  /* Design idea: a calm "checkpoint". A big risk gauge sweeps to a score on a ticket-style card,
     and the whole page tints softly to match the verdict. */
  :root{--navy:#003087;--ink:#1c2a3a;--muted:#52606f;--bg:#f2f6fa;--paper:#ffffff;--line:#c9d6e3;--teal:#0070ba;
    --safe:#1e7a52;--risky:#a9650a;--scam:#b0372f;--vc:var(--teal);--fs:20px}
  :root.big{--fs:23px}
  body.v-SAFE{--bg:#e4f3ec;--vc:var(--safe)} body.v-RISKY{--bg:#fbf2de;--vc:var(--risky)} body.v-SCAM{--bg:#fbe7e4;--vc:var(--scam)}
  *{box-sizing:border-box} [hidden]{display:none!important}
  html{font-size:var(--fs)}
  body{margin:0;background:var(--bg);color:var(--ink);transition:background .8s;padding-bottom:5.5rem;
    font:1rem/1.55 "Atkinson Hyperlegible",system-ui,"Segoe UI",sans-serif}
  main{max-width:560px;margin:0 auto;padding:0 1rem 1.5rem}
  :focus-visible{outline:3px solid var(--teal);outline-offset:3px}

  header{display:flex;justify-content:space-between;align-items:center;padding:1rem 0 .6rem}
  .brand{display:flex;gap:.6rem;align-items:center;font-weight:700;font-size:.95rem;line-height:1.2;color:var(--navy)}
  .brand svg{width:42px;height:42px;flex:none}
  .ghost{width:auto;min-height:0;margin:0;background:none;border:2px solid var(--line);color:var(--navy);border-radius:999px;padding:.3rem .9rem;font:inherit;font-weight:700;cursor:pointer}

  .steps{list-style:none;display:flex;gap:.5rem;margin:.4rem 0 0;padding:0}
  .steps li{flex:1;border-top:6px solid var(--line);padding-top:.35rem;font-size:.8rem;color:var(--muted);border-radius:3px;transition:border-color .4s}
  .steps li.on{border-color:var(--vc);color:var(--ink);font-weight:700}

  h1{color:var(--navy);font-size:2.1rem;line-height:1.12;margin:1.4rem 0 .6rem;letter-spacing:-.01em}
  .lead{color:var(--muted);margin:0 0 1.2rem}
  .tiny{font-size:.85rem;color:var(--muted);margin:0 0 .4rem}
  .chips{display:flex;flex-wrap:wrap;gap:.5rem}
  .dot{width:.7rem;height:.7rem;border-radius:50%;flex:none}
  .dot.g{background:var(--safe)} .dot.a{background:var(--risky)} .dot.r{background:var(--scam)}

  label{display:block;font-weight:700;margin:1.1rem 0 .35rem}
  label small{font-weight:400;color:var(--muted)}
  input,textarea{width:100%;font:inherit;padding:.8rem .9rem;border:2px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink)}
  textarea{min-height:7rem;resize:vertical}
  .err{color:var(--scam);font-weight:700;min-height:1.6rem;margin:.6rem 0 0}

  button,.btn{display:block;width:100%;min-height:3.4rem;margin-top:.9rem;padding:1rem 1.2rem;border:0;border-radius:999px;
    background:var(--teal);color:#fff;font:inherit;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
